services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-SALESMANAGER}
      MYSQL_USER: ${MYSQL_USER:-shopizer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopizer}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shopizer_root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
