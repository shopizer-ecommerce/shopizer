name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./sm-shop
          platforms: linux/amd64
          push: true
          tags: 550487074451.dkr.ecr.us-east-1.amazonaws.com/shopizer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed successfully
        run: |
          echo "✅ Docker image successfully built and pushed to ECR"
          echo "Image: 550487074451.dkr.ecr.us-east-1.amazonaws.com/shopizer:latest"

      - name: Deploy to ECS
        run: |
          echo "🚀 Triggering ECS deployment..."
          aws ecs update-service \
            --cluster shopizer-demo-cluster \
            --service shopizer-demo-ecs-backend \
            --force-new-deployment \
            --region us-east-1 \
            --no-cli-pager
          echo "✅ ECS deployment triggered successfully!"
          echo "The service will pull the latest image and restart tasks."